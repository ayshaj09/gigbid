# Render Blueprint (https://render.com/docs/blueprint-spec). In Render: New -> Blueprint -> pick this repo,
# set blueprint path to infra/render.yaml, then fill the `sync: false` secrets in the dashboard.
services:
  - type: web
    name: gigbid-api
    runtime: docker
    dockerfilePath: infra/docker/python.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk: {name: appdata, mountPath: /app/data/processed, sizeGB: 1}
    envVars:
      - {key: APP_ENV, value: production}
      - {key: APP_SECRET_KEY, generateValue: true}
      - {key: INTERNAL_TOKEN, generateValue: true}
      - {key: DATABASE_URL, fromDatabase: {name: gigbid-db, property: connectionString}}
      - {key: MODEL_PROFILE, value: open}
      - {key: OPEN_MODEL_BASE_URL, sync: false}     # e.g. a hosted OpenAI-compatible open-model provider
      - {key: OPEN_MODEL_API_KEY, sync: false}
      - {key: EMBEDDER_PROVIDER, sync: false}       # sentence_transformers on CPU, or ollama if you host one
      - {key: GIGSIM_BASE_URL, sync: false}         # where your GigSim instance runs
      - {key: WEB_ORIGINS, sync: false}             # https://<your-web>.onrender.com
      - {key: LANGFUSE_PUBLIC_KEY, sync: false}
      - {key: LANGFUSE_SECRET_KEY, sync: false}
  - type: worker
    name: gigbid-worker
    runtime: docker
    dockerfilePath: infra/docker/python.Dockerfile
    dockerContext: .
    dockerCommand: arq worker.main.WorkerSettings
    envVars:
      - {key: API_URL, sync: false}                 # https://<your-api>.onrender.com
      - {key: INTERNAL_TOKEN, fromService: {type: web, name: gigbid-api, envVarKey: INTERNAL_TOKEN}}
      - {key: REDIS_URL, fromService: {type: keyvalue, name: gigbid-redis, property: connectionString}}
  - type: web
    name: gigbid-web
    runtime: docker
    dockerfilePath: infra/docker/web.Dockerfile
    dockerContext: .
    envVars:
      - {key: NEXT_PUBLIC_API_URL, sync: false}     # https://<your-api>.onrender.com (build-time)
  - type: keyvalue
    name: gigbid-redis
    ipAllowList: []
databases:
  - name: gigbid-db
