[project]
name = "gigbid"
version = "0.2.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016)"
requires-python = ">=3.11"
# Pinned to the versions this code was developed and tested against.
dependencies = [
  "fastapi==0.162.6",
  "uvicorn[standard]>=0.30",
  "pydantic==2.13.5",
  "pyyaml>=6.0",
  "langgraph==1.2.21",
  "langgraph-checkpoint-sqlite>=3.0",
  "langgraph-checkpoint-postgres==3.2.0",
  "psycopg[binary,pool]>=3.2",
  "langchain-core==1.8.0",
  "langchain-openai==1.7.4",
  "langchain-mcp-adapters==0.3.2",
  "mcp==1.30.0",
  "httpx==0.28.1",
  "numpy>=2.0",
  "rank-bm25==0.2.2",
  "python-dotenv>=1.0",
  "pydantic[email]>=2.13",
  "sse-starlette>=2.0",
  "pyjwt>=2.9",
  "cryptography>=43",
  "python-multipart>=0.0.9",
]

[project.scripts]
gigbid-portfolio-mcp = "mcp_servers.portfolio.server:main"

[project.optional-dependencies]
models = ["sentence-transformers>=3.0", "pypdf>=4.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
worker = ["arq>=0.26"]
experiments = ["langgraph-supervisor>=0.0.31"]
tracing = ["langfuse>=3.0"]

[tool.ruff]
line-length = 120
extend-exclude = ["gigsim"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["agent*", "rag*", "mcp_servers*", "apps*", "worker*", "evals*", "dev*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md", "*.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
