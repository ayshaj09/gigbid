name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -e ".[dev]"
      - name: No secrets committed
        run: |
          test ! -f .env
          ! git grep -nE '(sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH) PRIVATE KEY)' -- ':!*.md'
      - name: gigsim/ unchanged (hash recorded in GIGSIM.sha256 when the simulator is added)
        run: |
          if [ -d gigsim ] && [ -f GIGSIM.sha256 ]; then
            h=$(find gigsim -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            [ "$h" = "$(cat GIGSIM.sha256)" ] || { echo "gigsim/ was modified"; exit 1; }
          fi
      - run: ruff check .
      - name: Unit, MCP, contract (schema snapshots) and graph integration tests
        run: pytest -q
