# Kaggle sources the instructor approved. Download each into data/raw/<key>/ (see scripts/download_datasets.sh).
# `columns` maps our field -> candidate column names (first match wins, case-insensitive).
# Run `python -m datapipe.inspect` after downloading; if a field shows "MISSING", add the real column name here.
# LICENCE: copy the exact licence shown on each Kaggle page into `licence` before submitting.
sources:
  upwork_jobs_2024_50k:
    kaggle: asaniczka/upwork-job-postings-dataset-2024-50k-records
    role: job posts (real titles, budgets, countries, dates)
    licence: "CHECK KAGGLE PAGE"
    columns: &jobcols
      title: [title, job_title, Title]
      description: [description, job_description, Description, desc, summary]
      link: [link, url, job_url, Link]
      posted_at: [published_date, posted_date, date_posted, posted_on, date, published_at]
      is_hourly: [is_hourly, hourly, job_type, Job Type, type, payment_type]
      hourly_low: [hourly_low, hourly_min, rate_low, min_rate]
      hourly_high: [hourly_high, hourly_max, rate_high, max_rate]
      budget: [budget, fixed_budget, price, fixed_price, Budget]
      country: [country, client_country, location, Country]
      skills: [skills, tags, Skills, required_skills]
      experience_level: [experience_level, level, Experience Level, tier]
  upwork_jobs_200k:
    kaggle: asaniczka/all-jobs-on-upwork-200k-plus
    role: job posts (more of the same shape; used for market statistics)
    licence: "CHECK KAGGLE PAGE"
    columns: *jobcols
  upwork_jobs_60k:
    kaggle: ahmedmyalo/upwork-freelance-jobs-60k
    role: job posts (2023); used for descriptions/skills if present
    licence: "CHECK KAGGLE PAGE"
    columns: *jobcols
  contracts_1_3m:
    kaggle: asaniczka/freelance-contracts-dataset-1-3-million-entries
    role: completed contracts -> realistic rates, amounts, durations for pricing and client histories
    licence: "CHECK KAGGLE PAGE"
    columns:
      job_id: [job_id, contract_id, id]
      title: [title, job_title]
      freelancer_id: [freelancer_id, freelancer, user_id]
      start: [start_date, started, start]
      end: [end_date, ended, end]
      hours: [total_hours, hours, hours_worked]
      amount: [total_charge, amount_paid, total_paid, amount, earnings]
      hourly_rate: [hourly_rate, rate, avg_hourly_rate]
  freelancer_success:
    kaggle: sarveshchhetri/freelancer-success-earnings-and-churn-prediction
    role: freelancer profile distributions (rates, success score) to calibrate synthetic personas
    licence: "CHECK KAGGLE PAGE"
    columns:
      hourly_rate: [hourly_rate, rate, hourly_rate_usd, Hourly_Rate]
      success: [job_success_score, success_score, jss, success_rate, Job_Success_Score]
      earnings: [earnings, total_earnings, earnings_usd, Earnings_USD]
      category: [category, job_category, skill_category, Job_Category]
      experience: [experience_years, years_experience, experience, Experience_Level]
  fake_job_postings:
    kaggle: adityammantri/trial-1
    role: real/fake labelled postings (EMSCAD-style) -> real scam examples and scam labels
    licence: "CHECK KAGGLE PAGE"
    columns:
      title: [title]
      description: [description, job_description]
      requirements: [requirements]
      company_profile: [company_profile]
      salary_range: [salary_range]
      fraudulent: [fraudulent, is_fake, label, fake]
